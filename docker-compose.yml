# =============================================================================
# Container names and ports are configured via Taskfile.yml vars:
#   APP_NAME → sets COMPOSE_PROJECT_NAME (auto-prefixes containers)
#   EXTERNAL_PORT → host port for the API (default: 8000)
# =============================================================================
services:
  postgres:
    image: postgres:17.4-alpine
    # Container name: ${COMPOSE_PROJECT_NAME}-postgres (auto-set by compose)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # Custom environment variables for init script
      ENVIRONMENT: local
      APP_DB_USER: ${DB_USER:-app_user}
      APP_DB_PASSWORD: ${DB_PASSWORD:-app_pass}
      APP_DB_NAME: ${DB_NAME:-app_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Container name: ${COMPOSE_PROJECT_NAME}-backend (auto-set by compose)
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    ports:
      - "${EXTERNAL_PORT:-8000}:8000"
    env_file:
      - ./.env.local
    environment:
      # Override DB_HOST to use container hostname
      - DB_HOST=postgres
      # Test database (uses same credentials, different database)
      - TEST_DB_HOST=postgres
      - TEST_DB_PORT=5432
      - TEST_DB_USER=${DB_USER:-app_user}
      - TEST_DB_PASSWORD=${DB_PASSWORD:-app_pass}
      - TEST_DB_NAME=app_db_test
    volumes:
      # Persistent data storage
      - ./backend/data:/app/data
      # Hot reload for development
      - ./backend/app:/app/app
      # Tests directory for development
      - ./backend/tests:/app/tests
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
