version: '3'

# =============================================================================
# CONFIGURATION - Modify these values for your project
# =============================================================================
# Main Taskfile - orchestrates all development tasks
# Secrets stored in 1Password vaults: YOUR-PROJECT-LOCAL, YOUR-PROJECT-TEST, YOUR-PROJECT-PROD

vars:
  # Project name - used for Docker container names and compose project
  APP_NAME: fastapi-template
  # External port exposed on host machine (internal is always 8000)
  EXTERNAL_PORT: "8000"

env:
  # Allow Task-run commands to bypass docker guardrails
  APP_ALLOW_DOCKER: "1"
  # Docker Compose project name - scopes all containers/networks/volumes
  COMPOSE_PROJECT_NAME: "{{.APP_NAME}}"
  # Pass port to docker-compose
  EXTERNAL_PORT: "{{.EXTERNAL_PORT}}"

# Include modular Taskfiles
includes:
  env:
    taskfile: ./tasks/env.yml
    dir: .
  helpers:
    taskfile: ./tasks/helpers.yml
    dir: .

tasks:
  # === Main Entry Points ===

  default:
    desc: "Show help"
    aliases: [help]
    silent: true
    cmds:
      - task --list

  dev:
    desc: "🚀 Start development (smart: auto-updates, skips what's done)"
    cmds:
      - task: helpers:dev_smart

  clean:
    desc: "🧹 Clean up development environment (stops servers, removes artifacts)"
    cmds:
      - task: helpers:clean_environment

  clean:all:
    desc: "🗑️  Remove project containers, volumes, images, and all artifacts"
    cmds:
      - task: helpers:clean_environment
        vars:
          ALL: "true"

  # === Backward Compatibility Aliases ===

  env:
    desc: "Generate .env files (smart: auto-setup and auto-create if needed)"
    cmds:
      - task: env:generate
        vars:
          ENV: '{{.ENV | default ""}}'

  stop:
    desc: "🛑 Stop development environment"
    cmds:
      - docker compose down

  logs:
    desc: "📋 View backend logs"
    cmds:
      - docker compose logs -f backend

  test:
    desc: "🧪 Run tests"
    cmds:
      - docker compose exec backend uv run pytest -v
