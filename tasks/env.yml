version: '3'

# =============================================================================
# Vault names are derived from VAULT_PREFIX in .setup.config (run ./setup.sh).
# Vaults: ${VAULT_PREFIX}-LOCAL, ${VAULT_PREFIX}-TEST, ${VAULT_PREFIX}-PROD

tasks:
  generate:
    desc: "Pull secrets from 1Password and write .env.<env> (default: local; pass ENV=test|prod for others, or no ENV for all three)"
    deps: [_check_op]
    vars:
      ENV: '{{.ENV | default ""}}'
    cmds:
      - |
        if [ -n "{{.ENV}}" ]; then
          ./scripts/generate-env.sh "{{.ENV}}"
        else
          ./scripts/generate-env.sh local
          ./scripts/generate-env.sh test
          ./scripts/generate-env.sh prod
        fi

  status:
    desc: "Show which .env files exist locally"
    silent: true
    cmds:
      - |
        echo "Local .env files:"
        for env in local test prod; do
          if [ -f ".env.$env" ]; then
            echo "  $env: ✅"
          else
            echo "  $env: ❌"
          fi
        done

  clean:
    desc: "Delete all generated .env files"
    prompt: "Remove all .env.* files?"
    cmds:
      - rm -f .env .env.*
      - echo "Cleaned up all .env files"

  setup:
    desc: "Re-run the setup wizard (./setup.sh). For first-time joiners, use ./onboard.sh instead."
    cmds:
      - ./setup.sh

  add:
    desc: "Add a secret to a 1Password vault (interactive; optionally declares the field in backend/app/core/config.py)"
    deps: [_check_op]
    interactive: true
    cmds:
      - ./scripts/add-secret.sh

  _check_op:
    silent: true
    preconditions:
      - sh: command -v op >/dev/null 2>&1
        msg: |
          ❌ 1Password CLI not installed
          Run: ./setup.sh
      - sh: op account list >/dev/null 2>&1
        msg: |
          ❌ Not signed in to 1Password
          Run: op signin
