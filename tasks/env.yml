version: '3'

# =============================================================================
# CONFIGURATION - Modify vault names for your project
# =============================================================================
# Secrets stored in vaults: YOUR-PROJECT-LOCAL, YOUR-PROJECT-TEST, YOUR-PROJECT-PROD

tasks:
  generate:
    desc: "Generate .env files from 1Password vaults"
    deps: [_check_op]
    vars:
      ENV: '{{.ENV | default ""}}'
    cmds:
      - |
        if [ -n "{{.ENV}}" ]; then
          ./scripts/generate-env.sh "{{.ENV}}"
        else
          ./scripts/generate-env.sh local
          ./scripts/generate-env.sh test
          ./scripts/generate-env.sh prod
        fi

  status:
    desc: "Show local .env file status"
    silent: true
    cmds:
      - |
        echo "Local .env files:"
        for env in local test prod; do
          if [ -f ".env.$env" ]; then
            echo "  $env: ✅"
          else
            echo "  $env: ❌"
          fi
        done

  clean:
    desc: "Remove all generated .env files"
    prompt: "Remove all .env.* files?"
    cmds:
      - rm -f .env .env.*
      - echo "Cleaned up all .env files"

  setup:
    desc: "Install 1Password CLI and sign in"
    cmds:
      - ./scripts/setup-1password.sh

  _check_op:
    silent: true
    preconditions:
      - sh: command -v op >/dev/null 2>&1
        msg: |
          ❌ 1Password CLI not installed
          Run: task env:setup
      - sh: op account list >/dev/null 2>&1
        msg: |
          ❌ Not signed in to 1Password
          Run: op signin
